name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "config/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# One deploy at a time. Do not cancel a production deploy already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload in its own job so deploy-pages looks up the artifact a few
  # seconds later. In a single job the listing can return 0 artifacts
  # immediately after a successful upload (actions/deploy-pages#451).
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Copy filter config into the site
        run: |
          mkdir -p site/data
          cp config/filtre_global.json site/data/filtre_global.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
